[project]
name = "dify-plugin-keeperhub"
version = "0.1.0"
description = "KeeperHub tools for Dify — simulate onchain calls before they sign, then execute the identical call."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "dify_plugin>=0.10.2",
    # KeeperHub's own published MCP kernel. Their SDK strategy is a shared
    # kernel plus per-framework adapters that import it, so this plugin
    # composes with that rather than re-implementing the transport.
    "keeperhub-mcp>=0.1.0",
]

[dependency-groups]
dev = ["pytest>=8"]
