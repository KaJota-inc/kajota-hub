[project]
name = "ielts-sda-prep-api"
version = "0.1.0"
description = "Sync backend for the IELTS × System Design × PhD prep React app (cross-device state + audio-take storage)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ielts_sda_prep_api"]

[project.scripts]
ielts-sda-prep-api = "ielts_sda_prep_api.server:main"
