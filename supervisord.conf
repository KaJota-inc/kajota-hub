[program:keeperhub-escrow]
command=/srv/run/keeperhub-escrow.sh
autorestart=true
startsecs=3
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# OKX A2A daemon — XMTP identity that owns ASP 5855. Identity + inbox
# provisioned from Render secret file /etc/secrets/a2a-state.tar.gz on
# first boot. See scripts/run/okx-a2a.sh for the extraction logic.
# 10s startsecs gives the SQLite dbs time to open + XMTP client to init.
[program:okx-a2a]
command=/srv/run/okx-a2a.sh
autorestart=true
startsecs=10
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
